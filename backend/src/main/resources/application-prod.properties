# Used on Render (SPRING_PROFILES_ACTIVE=prod). PostgreSQL database.
# Either set DB_URL (full JDBC url) or DB_HOST / DB_PORT / DB_NAME (render.yaml does this).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
server.forward-headers-strategy=framework
