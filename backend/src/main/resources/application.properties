spring.application.name=easy-task-backend
# Render provides PORT. Locally the app runs on 8088.
server.port=${PORT:8088}

# ---- Default (local) database: H2 file, zero configuration ----
spring.datasource.url=jdbc:h2:file:./data/easytaskdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

spring.jackson.serialization.write-dates-as-timestamps=false

# ---- App settings ----
# Time zone used for "today", "overdue" and reminders (servers on Render run in UTC)
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
# Comma separated list of frontends allowed to call the API (patterns allowed)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
# Insert a few sample records when the database is empty
app.seed-data=${SEED_DATA:true}
